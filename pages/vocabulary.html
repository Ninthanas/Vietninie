<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Từ Vựng & Flashcard 3D SRS — SenTrúc (莲竹学堂)</title>
  <link rel="icon" type="image/jpeg" href="../logo-mark.jpg?v=2026" /><link rel="apple-touch-icon" href="../logo-mark.jpg?v=2026" />
  <link rel="stylesheet" href="../css/global.css?v=20260930" />
  <link rel="stylesheet" href="../css/vocabulary.css?v=20260930" />
  <link rel="stylesheet" href="../css/responsive.css?v=20260930" />
</head>
<body>
  <div id="appHeader"></div>

  <main class="section-block">
    <div class="container">
      <!-- Top Header & Mode Switch -->
      <div class="section-header">
        <div>
          <span class="badge badge-rose" data-i18n="directionBadge">🇻🇳 Người Việt học Tiếng Trung 🇨🇳</span>
          <h1 style="font-size: 2rem; font-weight: 800; margin-top: 6px;" data-i18n="vocabPageTitle">
            Kho Từ Vựng Thực Chiến (2.300+ Từ - 60 Chủ Đề)
          </h1>
          <p id="vocabCountSummary" style="color: var(--text-secondary); margin-top: 4px;"></p>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="button" id="modeListBtn" class="btn btn-primary" data-i18n="modeList">📋 Danh sách từ</button>
          <button type="button" id="modeFlashcardBtn" class="btn btn-outline" data-i18n="modeFlashcard">🃏 Chế độ Flashcard 3D</button>
        </div>
      </div>

      <!-- Search & Filter Toolbar -->
      <div class="vocab-toolbar">
        <div class="search-row">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input
              type="search"
              id="vocabSearchInput"
              data-i18n-placeholder="vocabSearchPlaceholder"
              placeholder="Tìm bằng chữ Hán (你好), Pinyin (ni hao / nǐ hǎo), nghĩa tiếng Việt (xin chào) hoặc chủ đề..."
              aria-label="Search vocabulary"
            />
          </div>
        </div>

        <div class="filter-controls-grid">
          <select id="topicFilterSelect" class="filter-select" aria-label="Filter by Topic"></select>
          <select id="levelFilterSelect" class="filter-select" aria-label="Filter by Level"></select>
          <select id="typeFilterSelect" class="filter-select" aria-label="Filter by Word Type"></select>
        </div>

        <div class="status-pills">
          <button type="button" class="status-pill active" data-status-filter="all" data-i18n="filterAll">Tất cả</button>
          <button type="button" class="status-pill" data-status-filter="learned" data-i18n="filterLearned">✓ Đã học</button>
          <button type="button" class="status-pill" data-status-filter="unlearned" data-i18n="filterUnlearned">○ Chưa học</button>
          <button type="button" class="status-pill" data-status-filter="favorite" data-i18n="filterFavorite">❤️ Yêu thích</button>
          <button type="button" class="status-pill" data-status-filter="review" data-i18n="filterReview">🧠 Cần ôn SRS</button>
        </div>
      </div>

      <!-- 3D Flashcard & Spaced Repetition Stage (Hidden in List Mode) -->
      <div id="flashcardStageMount" style="display:none;"></div>

      <!-- Paginated Vocabulary Grid Stage -->
      <div id="vocabListStage">
        <div id="vocabGridMount" class="vocab-grid"></div>
        <div id="vocabPaginationMount" class="pagination-bar"></div>
      </div>
    </div>
  </main>

  <div id="appFooter"></div>

  <script src="../data/data-bundle.js?v=20260930"></script>
  <script src="../js/language.js?v=20260930"></script>
  <script src="../js/storage.js?v=20260930"></script>
  <script src="../js/app.js?v=20260930"></script>
  <script src="../js/vocabulary.js?v=20260930"></script>
</body>
</html>
