server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: vietninie-api
  profiles:
    default: local
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:https://vietninie.local}
    audience: ${JWT_AUDIENCE:vietninie-web}
    ttl-minutes: ${JWT_TTL_MINUTES:15}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://ninthanas.github.io}
  seed-enabled: ${SEED_ENABLED:true}
  admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash}
