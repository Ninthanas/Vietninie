<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5F3"/>
      <stop offset="100%" stop-color="#FAF8F5"/>
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FDBA74"/>
    </linearGradient>
    <linearGradient id="coffeeGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="60%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Background Soft Pill Shape -->
  <rect width="500" height="320" rx="32" fill="url(#skyGrad)"/>

  <!-- Morning Sun -->
  <circle cx="390" cy="90" r="65" fill="url(#warmSun)" opacity="0.6"/>

  <!-- Subtle Street Skyline / Palm Silhouettes in soft peach -->
  <path d="M40 260 L90 220 L150 260 L210 240 L300 260 L360 210 L420 260 L500 240 L500 320 L0 320 Z" fill="#FCE7E4" opacity="0.8"/>

  <!-- Phin Drip Coffee Glass (Cà phê sữa đá) -->
  <g transform="translate(80, 70)">
    <!-- Phin Top Filter -->
    <path d="M45 40 L95 40 L90 75 L50 75 Z" fill="#94A3B8"/>
    <rect x="35" y="75" width="70" height="6" rx="3" fill="#64748B"/>
    <rect x="55" y="25" width="30" height="15" rx="3" fill="#CBD5E1"/>
    <!-- Glass Body -->
    <path d="M42 85 L98 85 L90 190 L50 190 Z" fill="url(#coffeeGlass)" rx="8" opacity="0.9"/>
    <!-- Condensed Milk Layer at bottom -->
    <path d="M50 165 L90 165 L89 188 L51 188 Z" fill="#FEF3C7"/>
    <!-- Ice cubes in glass -->
    <rect x="55" y="95" width="22" height="22" rx="4" fill="#FFFFFF" opacity="0.5"/>
    <rect x="66" y="125" width="20" height="20" rx="4" fill="#FFFFFF" opacity="0.5"/>
    <rect x="52" y="135" width="18" height="18" rx="4" fill="#FFFFFF" opacity="0.5"/>
    <!-- Straw -->
    <path d="M78 40 L98 0" stroke="#E05344" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Vietnamese Conical Hat (Nón lá) -->
  <g transform="translate(230, 110)">
    <path d="M120 70 L0 70 L60 0 Z" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
    <path d="M60 0 Q60 50 10 70" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M60 0 Q60 50 110 70" stroke="#F59E0B" stroke-width="1.5" fill="none" opacity="0.5"/>
    <ellipse cx="60" cy="70" rx="60" ry="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  </g>

  <!-- Red Hot Chili Pepper (Vietninie Mascot Accent) -->
  <g transform="translate(320, 160) rotate(-20)">
    <path d="M20 10 C20 4, 26 2, 28 8 C30 11, 26 14, 23 15 Z" fill="#10B981" />
    <path d="M22 15 C35 30, 48 55, 45 80 C43 95, 30 105, 20 112 C18 114, 15 110, 16 106 C20 90, 22 70, 18 50 C15 35, 12 25, 22 15 Z" fill="#E05344"/>
    <path d="M22 25 C28 40, 32 60, 30 75" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Friendly Dialogue Bubbles -->
  <g transform="translate(200, 35)">
    <rect x="0" y="0" width="130" height="42" rx="14" fill="#FFFFFF" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
    <path d="M30 42 L24 50 L38 42 Z" fill="#FFFFFF"/>
    <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#E05344">
      Xin chào! 👋
    </text>
  </g>

  <g transform="translate(310, 85)">
    <rect x="0" y="0" width="140" height="38" rx="12" fill="#E05344" filter="drop-shadow(0 4px 6px rgba(224,83,68,0.25))"/>
    <path d="M30 38 L24 45 L38 38 Z" fill="#E05344"/>
    <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">
      越学越辣 🌶️
    </text>
  </g>

  <!-- Floating Vietnamese Tones Diacritics -->
  <text x="190" y="110" font-family="serif" font-size="28" font-weight="bold" fill="#F59E0B" opacity="0.7">á</text>
  <text x="210" y="145" font-family="serif" font-size="28" font-weight="bold" fill="#10B981" opacity="0.7">à</text>
  <text x="175" y="170" font-family="serif" font-size="28" font-weight="bold" fill="#E05344" opacity="0.6">ạ</text>
  <text x="360" y="60" font-family="serif" font-size="26" font-weight="bold" fill="#6366F1" opacity="0.7">ả</text>
</svg>
