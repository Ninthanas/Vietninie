name: Java backend verification
on:
  push:
    paths:
      - 'backend-java/**'
      - 'my-app/**'
      - '.github/workflows/java-backend-ci.yml'
  pull_request:
    paths:
      - 'backend-java/**'
      - 'my-app/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Verify Java backend
        working-directory: backend-java
        run: bash mvnw -B verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - name: Verify React integration
        working-directory: my-app
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
